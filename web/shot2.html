<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:100%;overflow:hidden}
iframe{border:0;width:100vw;height:100vh}
img{position:absolute;left:-10px;top:-10px;width:1px;height:1px}
</style></head><body><iframe id="f"></iframe><img id="slow"><script>
const q = new URLSearchParams(location.search);
fetch("/api/v1/session", {method:"POST",headers:{"Content-Type":"application/json","X-NB-Console":"1"},
  body:JSON.stringify({key:q.get("key")}),credentials:"same-origin"})
  .then(()=>{document.getElementById("f").src=q.get("url");});
document.getElementById("slow").src="http://127.0.0.1:8899/slow?s="+(q.get("s")||6);
</script></body></html>
