<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutellaBoot 3 — Dashboard</title>
<link rel="icon" href="/common/favicon.png">
<link rel="stylesheet" href="/common/style.css">
<link rel="stylesheet" href="./dash.css">
</head>
<body class="dash">
<!-- A tela de transmissão: só leitura, nenhum comando — segura para deixar
     aberta num telão. Os gráficos acumulam na própria tela enquanto ela fica
     aberta (o servidor não guarda série para isto). -->

<header class="dhead">
  <h1>Maratona Linux <span class="dsub" data-i18n="dash_title"></span></h1>
  <span class="spacer"></span>
  <span id="updated" class="dsub"></span>
  <span id="clock" class="dclock"></span>
</header>

<section class="placar">
  <div class="bignum"><b id="n-online">–</b><span data-i18n="dash_machines_on"></span></div>
  <div class="bignum"><b id="n-total">–</b><span data-i18n="dash_machines_total"></span></div>
  <div class="bignum"><b id="n-sites">–</b><span data-i18n="dash_sites_active"></span></div>
  <div class="bignum alerta"><b id="n-alerts">–</b><span data-i18n="dash_alerts"></span></div>
</section>

<section class="graficos">
  <div class="gbox">
    <h2 data-i18n="dash_chart_online"></h2>
    <div id="g-online"></div>
  </div>
  <div class="gbox">
    <h2 data-i18n="dash_chart_res"></h2>
    <div id="g-res"></div>
    <div class="legenda">
      <span class="l1" data-i18n="dash_mem"></span>
      <span class="l2" data-i18n="dash_cpu"></span>
    </div>
  </div>
</section>

<nav class="dabas">
  <button type="button" data-vista="geral" class="on" data-i18n="dash_tab_overview"></button>
  <button type="button" data-vista="hw" data-i18n="dash_tab_hw"></button>
  <button type="button" data-vista="ed" data-i18n="dash_tab_editors"></button>
  <button type="button" data-vista="disco" data-i18n="dash_tab_disk"></button>
</nav>

<main>
  <div id="v-geral">
    <div id="mapa"></div>
    <p id="dvazio" class="dsub" hidden></p>
  </div>
  <div id="v-hw" hidden>
    <div class="duas">
      <div class="gbox"><h2 data-i18n="dash_hw_cpus"></h2><div id="inv-cpus"></div></div>
      <div class="gbox"><h2 data-i18n="dash_hw_ram"></h2><div id="inv-ram"></div></div>
    </div>
  </div>
  <div id="v-ed" hidden>
    <div class="duas">
      <div class="gbox"><h2 data-i18n="dash_ed_now"></h2><div id="inv-ed-agora"></div></div>
      <div class="gbox"><h2 data-i18n="dash_ed_minutes"></h2><div id="inv-ed-min"></div></div>
    </div>
  </div>
  <div id="v-disco" hidden>
    <div class="gbox">
      <h2><span data-i18n="dash_disk_title"></span> <b id="inv-disklow" class="ral"></b></h2>
      <div id="inv-discos"></div>
    </div>
  </div>
</main>

<!-- O zoom de uma sede: os dados finos, sem nenhum comando (o link para o
     hotconfig existe para quem precisa agir). Esc ou × fecha. -->
<div id="zoom" class="zoom" hidden>
  <div class="zoomcard">
    <div class="zhead">
      <span class="sid" id="z-id"></span>
      <span class="sname" id="z-name"></span>
      <span class="dsub" id="z-counts"></span>
      <span class="spacer"></span>
      <a id="z-hot" class="btn small" target="_blank" rel="noopener" data-i18n="dash_zoom_hotconfig"></a>
      <button type="button" id="z-close" class="small">✕</button>
    </div>
    <div class="gbox zgraf">
      <h2 data-i18n="dash_zoom_trend"></h2>
      <div id="z-graf"></div>
      <div class="legenda">
        <span class="l1" data-i18n="dash_mem"></span>
        <span class="l2" data-i18n="dash_cpu"></span>
      </div>
    </div>
    <div id="z-alertas"></div>
    <div id="z-maquinas" class="zmaq"></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
