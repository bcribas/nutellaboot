<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutellaBoot 3</title>
<link rel="icon" href="/common/favicon.png">
<link rel="stylesheet" href="/common/style.css">
<link rel="stylesheet" href="/index.css">
<!-- adianta o download do dicionário para reduzir o "pisca" de texto vazio -->
<link rel="preload" as="fetch" href="/common/locales/pt.json" crossorigin="anonymous">
<link rel="preload" as="fetch" href="/common/locales/en.json" crossorigin="anonymous">
<link rel="preload" as="fetch" href="/common/locales/es.json" crossorigin="anonymous">
</head>
<body>
<header class="topbar">
  <h1>NutellaBoot <span class="ver">3</span></h1>
  <span class="sub" data-i18n="home_tagline"></span>
  <span class="spacer"></span>
  <span id="lang"></span>
</header>

<main>
  <section class="hero">
    <img class="logo" src="/common/logo.png" alt="NutellaBoot" width="525" height="206">
    <p data-i18n="home_intro"></p>
  </section>

  <div class="cards">
    <!-- Coordenador de sede -->
    <section class="card entry" id="coord">
      <div class="icon">🧑‍🏫</div>
      <h2 data-i18n="home_coord_title"></h2>
      <p class="desc" data-i18n="home_coord_desc"></p>
      <label class="fld">
        <span data-i18n="home_coord_id"></span>
        <input type="text" id="cid" autocomplete="off" spellcheck="false" placeholder="25brbr">
      </label>
      <label class="fld">
        <span data-i18n="home_coord_token"></span>
        <input type="text" id="ctoken" autocomplete="off" spellcheck="false" placeholder="nb3i_…">
      </label>
      <div class="actions">
        <button type="button" id="go_config" class="primary" disabled data-i18n="home_coord_open_config"></button>
        <button type="button" id="go_hot" disabled data-i18n="home_coord_open_hotconfig"></button>
      </div>
      <p class="status" id="coord_status"></p>
      <p class="hint" data-i18n="home_coord_hint"></p>
    </section>

    <!-- Quero uma imagem própria -->
    <section class="card entry" id="create">
      <div class="icon">✨</div>
      <h2 data-i18n="home_create_title"></h2>
      <p class="desc" data-i18n="home_create_desc"></p>
      <div class="links">
        <a class="btn primary" href="/criar/" data-i18n="home_create_open"></a>
      </div>
    </section>

    <!-- Administração -->
    <section class="card entry" id="admin">
      <div class="icon">🛠️</div>
      <h2 data-i18n="home_admin_title"></h2>
      <p class="desc" data-i18n="home_admin_desc"></p>
      <!-- já estou dentro: preenchido por GET /api/v1/session -->
      <div id="admin_in" class="hidden">
        <p class="status" id="admin_who"></p>
        <div class="actions">
          <a class="btn primary" href="/admin/" data-i18n="home_admin_open"></a>
          <a class="btn" href="/laboratorios/" data-i18n="fleet_title"></a>
          <button type="button" id="admin_logout" data-i18n="admin_logout"></button>
        </div>
        <button type="button" class="linkish" id="admin_other" data-i18n="home_admin_other"></button>
      </div>
      <!-- <form> de verdade: é o que o gerenciador de senhas do navegador
           reconhece para oferecer salvar a chave. O JS faz preventDefault e
           chama a API; a action é só o destino honesto se o JS não carregar. -->
      <form id="admin_form" method="post" action="/api/v1/session" class="hidden">
        <!-- "usuário" só para o gerenciador guardar um par usuário/senha: fica
             fora da tela, mas NÃO é type=hidden (o Chrome o ignora ao detectar
             o formulário). Vira "convite" quando o que se cola é NB3-, para as
             duas credenciais não se sobrescreverem. -->
        <input type="text" id="admin_user" name="username" autocomplete="username" value="admin"
               readonly tabindex="-1" aria-hidden="true" class="vh">
        <label class="fld" for="akey"><span data-i18n="home_admin_key"></span></label>
        <div class="pwd">
          <input type="password" id="akey" name="password" autocomplete="current-password"
                 spellcheck="false" placeholder="nb3a_…  /  NB3-XXXX-XXXX-XXXX" required>
          <button type="button" class="eye" id="akey_eye" aria-pressed="false">👁</button>
        </div>
        <div class="actions">
          <button type="submit" id="go_admin" class="primary" data-i18n="home_admin_enter"></button>
        </div>
        <p class="status" id="admin_status" aria-live="polite"></p>
        <p class="hint" data-i18n="home_admin_remember"></p>
      </form>
      <p class="status" id="admin_checking" data-i18n="home_admin_checking"></p>
    </section>

    <!-- Documentação -->
    <section class="card entry" id="docs">
      <div class="icon">📖</div>
      <h2 data-i18n="home_docs_title"></h2>
      <p class="desc" data-i18n="home_docs_desc"></p>
      <div class="links">
        <a class="btn" href="/docs/operations.md" data-i18n="home_docs_operations"></a>
        <a class="btn" href="/api/v1/docs" data-i18n="home_docs_api"></a>
      </div>
    </section>
  </div>

  <details class="guide">
    <summary data-i18n="home_guide_title"></summary>
    <p><strong data-i18n="home_coord_title"></strong>: <span data-i18n="home_guide_coord"></span></p>
    <p><strong data-i18n="home_admin_title"></strong>: <span data-i18n="home_guide_admin"></span></p>
  </details>
</main>

<script type="module" src="/index.js"></script>
</body>
</html>
