<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutellaBoot 3 — Administração</title>
<link rel="icon" href="/common/favicon.png">
<link rel="stylesheet" href="/common/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="admin_title"></h1>
  <span class="spacer"></span>
  <!-- só aparece depois de entrar: sem sessão a tela da frota responde 401 -->
  <span id="healthinfo" class="sub hidden"></span>
  <a id="gofrota" class="btn small primary hidden" href="/laboratorios/" data-i18n="fleet_title"></a>
  <button type="button" id="logout" class="small hidden" data-i18n="admin_logout"></button>
  <span id="lang"></span>
</header>

<main class="wide">
  <!-- <form> de verdade, com o par usuário/senha que o gerenciador de senhas
       do navegador reconhece (o mesmo da home, para o autofill valer nas duas) -->
  <form class="card" id="login" method="post" action="/api/v1/session">
    <h2 data-i18n="admin_key"></h2>
    <p class="help muted" data-i18n="admin_key_help"></p>
    <input type="text" id="login_user" name="username" autocomplete="username" value="admin"
           readonly tabindex="-1" aria-hidden="true" class="vh">
    <div class="actions">
      <div class="pwd" style="max-width:420px">
        <input type="password" id="key" name="password" autocomplete="current-password" spellcheck="false" required>
        <button type="button" class="eye" id="key_eye" aria-pressed="false">👁</button>
      </div>
      <button type="submit" id="enter" class="primary" data-i18n="admin_enter"></button>
    </div>
  </form>

  <div id="panel" class="hidden">
    <div class="card" id="whocard" style="border-color:var(--accent)">
      <h2><span id="who_label"></span> <span id="who_kind" class="pill"></span></h2>
      <p class="help muted" id="who_help"></p>
      <div id="who_quotas" class="muted mono"></div>
    </div>

    <!-- A página cresceu: âncoras, e não abas (aba esconderia conteúdo do
         Ctrl+F e guardaria estado). -->
    <nav id="secnav" class="secnav">
      <a href="#frotacard" data-i18n="nav_fleet"></a>
      <a href="#sec_models" data-i18n="nav_models"></a>
      <a href="#sec_images" data-i18n="nav_images"></a>
      <a href="#sec_owners" data-admin-only data-i18n="nav_owners"></a>
      <a href="#sec_keys" data-admin-only data-i18n="nav_keys"></a>
      <a href="#sec_layers" data-i18n="nav_layers"></a>
      <a href="#sec_usb" data-admin-only data-i18n="nav_usb"></a>
      <a href="#sec_audit" data-admin-only data-i18n="nav_audit"></a>
    </nav>

    <!-- A porta para a frota. Era um botão do tamanho do "sair" na barra de
         cima, e ninguém achava. -->
    <div class="card" id="frotacard" style="border-color:var(--ok)">
      <h2 data-i18n="fleet_card_title"></h2>
      <p class="help muted" data-i18n="fleet_card_help"></p>
      <div class="actions">
        <a class="btn primary" href="/laboratorios/" data-i18n="fleet_card_go"></a>
        <a class="btn" href="/dashboard/" target="_blank" rel="noopener" data-i18n="fleet_dashboard"></a>
        <button type="button" class="btn" id="sharedash" data-i18n="dash_share_make"></button>
      </div>
      <!-- a visão da frota: o que aparece no dashboard e nos laboratórios -->
      <div id="fview" class="fview"></div>
      <div class="actions" data-admin-only>
        <label class="inline"><input type="radio" name="sharekind" id="share_follow" checked>
          <span data-i18n="dash_share_follow"></span></label>
        <label class="inline"><input type="radio" name="sharekind" id="share_globs">
          <span data-i18n="dash_share_globs"></span></label>
        <input type="text" id="share_images" class="hidden" placeholder="26br* 26bo*" style="max-width:260px">
      </div>
      <p class="help muted" data-i18n="dash_share_help"></p>
      <div id="shareout" class="hidden">
        <input type="text" id="shareurl" readonly style="width:100%;font-family:ui-monospace,monospace">
        <p class="help muted" data-i18n="dash_share_once"></p>
      </div>
      <div id="sharelist"></div>
    </div>

    <div class="card" id="sec_models">
      <h2 data-i18n="models_section"></h2>
      <p class="help muted" data-i18n="models_section_help"></p>
      <div class="actions" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <label class="fld" style="max-width:220px"><span data-i18n="model_name"></span>
          <input type="text" id="mod_name" placeholder="meulab2026"></label>
        <label class="fld" style="flex:1;min-width:200px"><span data-i18n="model_description"></span>
          <input type="text" id="mod_desc"></label>
        <label class="fld" style="max-width:260px"><span data-i18n="model_from"></span>
          <select id="mod_from"></select></label>
        <button type="button" id="mod_create" class="primary" data-i18n="model_create"></button>
      </div>
      <p class="help muted" data-i18n="model_from_help"></p>
      <div id="modlist" class="muted" style="margin-top:12px" data-i18n="loading"></div>
      <div id="modpanel" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2 data-i18n="new_image"></h2>
      <div class="field">
        <div class="flabel" data-i18n="image_id"></div>
        <div class="help" data-i18n="image_id_help"></div>
        <input type="text" id="newid" style="max-width:320px">
      </div>
      <div class="field">
        <div class="flabel" data-i18n="image_name"></div>
        <input type="text" id="newname">
      </div>
      <div class="field">
        <div class="flabel" data-i18n="template"></div>
        <select id="newtpl" style="max-width:320px"></select>
      </div>
      <div class="field">
        <div class="flabel" data-i18n="profile"></div>
        <div class="help" data-i18n="profile_help"></div>
        <select id="newprofile" style="max-width:320px">
          <option value="official" data-i18n="profile_official"></option>
          <option value="free" data-i18n="profile_free"></option>
        </select>
      </div>
      <div class="field">
        <div class="flabel" data-i18n="wallpaper_at_creation"></div>
        <input type="file" id="newwall" accept="image/png,image/jpeg">
        <label style="display:block;margin-top:8px">
          <input type="checkbox" id="newwalllock">
          <span data-i18n="wallpaper_lock_label"></span>
        </label>
      </div>
      <div class="actions">
        <label class="inline" data-admin-only><input type="checkbox" id="newdashhidden">
          <span data-i18n="dashboard_hidden_at_creation"></span></label>
        <button type="button" id="create" class="primary" data-i18n="create"></button>
        <span id="createstatus" class="muted"></span>
      </div>
    </div>

    <div class="card" data-admin-only>
      <h2 data-i18n="bulk"></h2>
      <p class="help muted" data-i18n="bulk_help"></p>
      <textarea id="bulktsv" spellcheck="false"
        placeholder="26brbr&#9;Brazilian Finals&#9;maratonalinux2404"></textarea>
      <div class="actions" style="margin-top:10px">
        <button type="button" id="bulkgo" class="primary" data-i18n="bulk_create"></button>
        <button type="button" id="bulkcsv" class="hidden" data-i18n="download_csv"></button>
        <span id="bulkstatus" class="muted"></span>
      </div>
    </div>

    <div class="card" id="sec_images">
      <h2><span data-i18n="images"></span> <span id="imgcount" class="muted"></span></h2>
      <div class="actions" style="margin-bottom:10px">
        <input type="text" id="filter" data-i18n-placeholder="search" style="max-width:260px">
        <select id="ownerfilter" data-admin-only style="max-width:260px"></select>
        <button type="button" id="reload" class="small" data-i18n="refresh"></button>
      </div>
      <div id="imglist" class="muted" data-i18n="loading"></div>
    </div>

    <div class="card" id="sec_invites" data-admin-only>
      <h2 data-i18n="invites"></h2>
      <p class="help muted" data-i18n="invites_help"></p>
      <div class="actions" style="flex-wrap:wrap; gap:12px; align-items:flex-end">
        <label class="fld" style="max-width:120px"><span data-i18n="invite_count"></span>
          <input type="number" id="inv_count" value="1" min="1"></label>
        <label class="fld" style="max-width:140px"><span data-i18n="invite_max_images"></span>
          <input type="number" id="inv_max" value="1" min="1"></label>
        <label class="fld" style="max-width:170px"><span data-i18n="invite_build_quota"></span>
          <input type="number" id="inv_quota" value="5" min="0"></label>
        <label class="fld" style="max-width:200px"><span data-i18n="create_template"></span>
          <select id="inv_tpl"></select></label>
        <label class="fld" style="max-width:220px"><span data-i18n="profile"></span>
          <select id="inv_profile">
            <option value="free" data-i18n="profile_free"></option>
            <option value="official" data-i18n="profile_official"></option>
          </select></label>
        <label class="fld" style="flex:1; min-width:160px"><span data-i18n="request_note"></span>
          <input type="text" id="inv_note"></label>
        <label class="fld" style="max-width:220px"><span data-i18n="invite_label"></span>
          <input type="text" id="inv_label"></label>
        <label class="fld" style="max-width:120px"><span data-i18n="invite_max_models"></span>
          <input type="number" id="inv_maxmodels" value="2" min="0"></label>
        <label class="fld" style="max-width:140px"><span data-i18n="invite_expires_days"></span>
          <input type="number" id="inv_expires" min="0" placeholder="∞"></label>
        <label class="inline"><input type="checkbox" id="inv_walllock">
          <span data-i18n="invite_wallpaper_locked"></span></label>
        <button type="button" id="inv_gen" class="primary" data-i18n="invite_generate"></button>
      </div>
      <div id="invlist" class="muted" style="margin-top:12px" data-i18n="loading"></div>
    </div>

    <div class="card" data-admin-only>
      <h2 data-i18n="requests_admin"></h2>
      <div id="reqlist" class="muted" data-i18n="loading"></div>
    </div>

    <div class="card" id="sec_layers">
      <h2 data-i18n="layers_section"></h2>
      <p class="help muted" data-i18n="layers_section_help"></p>
      <div class="tabs" style="display:flex;gap:8px;margin-bottom:14px">
        <button type="button" id="ltab_tpl" class="small on" data-i18n="layer_by_template"></button>
        <button type="button" id="ltab_img" class="small" data-i18n="layer_by_image"></button>
      </div>

      <div id="lpane_tpl">
        <div class="actions" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
          <label class="fld" style="max-width:200px"><span data-i18n="layer_name"></span>
            <input type="text" id="lay_name" placeholder="mono"></label>
          <label class="fld" style="max-width:220px"><span data-i18n="template"></span>
            <select id="lay_tpl"></select></label>
          <label class="fld" style="flex:1;min-width:220px"><span data-i18n="layer_packages"></span>
            <input type="text" id="lay_pkgs" placeholder="htop tmux"></label>
          <button type="button" id="lay_build" class="primary" data-i18n="layer_build"></button>
        </div>
        <div class="field">
          <div class="flabel" data-i18n="layer_attach_to"></div>
          <div id="lay_images" class="list-editor" style="max-height:160px;overflow:auto"></div>
        </div>
      </div>

      <div id="lpane_img" class="hidden">
        <div class="actions" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
          <label class="fld" style="max-width:220px"><span data-i18n="image"></span>
            <select id="layi_img"></select></label>
          <label class="fld" style="max-width:200px"><span data-i18n="layer_name"></span>
            <input type="text" id="layi_name" placeholder="spim"></label>
          <label class="fld" style="flex:1;min-width:220px"><span data-i18n="layer_packages"></span>
            <input type="text" id="layi_pkgs" placeholder="spim"></label>
          <button type="button" id="layi_build" class="primary" data-i18n="layer_build"></button>
        </div>
      </div>

      <div id="laylist" class="muted" style="margin-top:12px" data-i18n="layer_none"></div>
    </div>

    <div class="card" id="sec_usb" data-admin-only>
      <h2 data-i18n="usb_section"></h2>
      <p class="help muted" data-i18n="usb_section_help"></p>
      <div class="actions">
        <button type="button" id="usb_build" class="small" data-i18n="usb_regenerate"></button>
        <span id="usb_info" class="muted"></span>
      </div>
      <div id="usbstate" class="muted" style="margin-top:10px" data-i18n="loading"></div>
    </div>

    <div class="card" data-admin-only>
      <h2 data-i18n="publish_section"></h2>
      <p class="help muted" data-i18n="publish_help"></p>
      <div class="actions">
        <button type="button" id="pub_retry" class="small" data-i18n="publish_retry"></button>
        <span id="pub_info" class="muted"></span>
        <span class="spacer"></span>
        <input type="text" id="pub_file" list="pub_files" data-i18n-placeholder="publish_file_label" style="max-width:300px">
        <datalist id="pub_files"></datalist>
        <select id="pub_kind" class="small">
          <option value="layers" data-i18n="publish_kind_layers"></option>
          <option value="usb" data-i18n="publish_kind_usb"></option>
        </select>
        <button type="button" id="pub_go" class="small" data-i18n="publish_go"></button>
      </div>
      <div id="publist" class="muted" style="margin-top:10px" data-i18n="publish_none"></div>
    </div>

    <div class="card" id="sec_owners" data-admin-only>
      <h2 data-i18n="owners_section"></h2>
      <p class="help muted" data-i18n="owners_help"></p>
      <div id="ownerlist" class="muted" data-i18n="loading"></div>
    </div>

    <div class="card" id="sec_keys" data-admin-only>
      <h2 data-i18n="keys_section"></h2>
      <p class="help muted" data-i18n="keys_section_help"></p>

      <h3 data-i18n="adminkey_title"></h3>
      <div id="adminkeylist" class="muted" data-i18n="loading"></div>
      <div class="actions" style="align-items:flex-end;gap:12px">
        <label class="fld" style="max-width:220px"><span data-i18n="adminkey_id"></span>
          <input type="text" id="adminkey_id" placeholder="camila" spellcheck="false"></label>
        <button type="button" id="adminkey_create" class="primary" data-i18n="adminkey_create"></button>
      </div>
      <div id="adminkey_out"></div>

      <h3 data-i18n="svckey_title" style="margin-top:22px"></h3>
      <div id="svclist" class="muted" data-i18n="loading"></div>
      <div class="actions" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <label class="fld" style="max-width:220px"><span data-i18n="svckey_name"></span>
          <input type="text" id="svc_name" placeholder="moj-2026" spellcheck="false"></label>
        <label class="fld" style="flex:1;min-width:220px"><span data-i18n="svckey_images"></span>
          <input type="text" id="svc_images" placeholder="26br* 26bo*" spellcheck="false"></label>
        <button type="button" id="svc_create" class="primary" data-i18n="svckey_create"></button>
      </div>
      <p class="help muted" data-i18n="svckey_images_help"></p>
      <div id="svc_scopes" class="checks"></div>
      <div id="svc_out"></div>
    </div>

    <div class="card" id="sec_audit" data-admin-only>
      <h2 data-i18n="audit_section"></h2>
      <p class="help muted" data-i18n="audit_help"></p>
      <div class="actions"><button type="button" id="audit_reload" class="small" data-i18n="refresh"></button></div>
      <div id="auditlist" class="muted" data-i18n="loading"></div>
    </div>

  </div>
</main>

<!-- Depois do painel, de propósito: o formulário de login continua sendo o
     primeiro <form> com campo de senha da página (é o que o gerenciador de
     senhas preenche, e o que os testes conferem). -->
<dialog id="reauth" class="reauth">
  <form id="reauth_form" method="dialog">
    <h2 data-i18n="reauth_title"></h2>
    <p class="help muted" data-i18n="reauth_help"></p>
    <input type="text" name="username" autocomplete="username" value="admin"
           readonly tabindex="-1" aria-hidden="true" class="vh">
    <input type="password" id="reauth_key" name="password" autocomplete="current-password"
           spellcheck="false" required>
    <p id="reauth_err" class="warn hidden" data-i18n="reauth_bad"></p>
    <div class="actions">
      <button type="submit" class="primary" data-i18n="reauth_submit"></button>
      <button type="button" id="reauth_cancel" data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
