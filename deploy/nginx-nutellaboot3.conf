# NutellaBoot 3 — nginx na frente do uvicorn.
#
# Dimensionado para a primeira fase: ~1600 máquinas ligadas ao mesmo tempo,
# teto de 2000. Cada máquina segura UMA conexão esperando comando (long-poll),
# então "conexões simultâneas" aqui não é pico de tráfego — é o estado normal.
#
# Instalar em /etc/nginx/sites-available/nutellaboot3 e ligar por symlink; o
# trecho comum aos `location` é o `deploy/nutellaboot3-proxy.conf`, que vai
# para /etc/nginx/snippets/. Os ajustes globais (worker_connections, rlimit)
# vão em nginx.conf e estão listados no fim deste arquivo, em comentário.
#
# Nada disto se edita à mão no servidor: o que não está versionado some no
# próximo reinstall e não aparece em diff nenhum.

upstream nutellaboot3 {
    server 127.0.0.1:8890;
    # Sem isto é um handshake TCP novo por long-poll: ~64 por segundo à toa,
    # e o dobro de sockets em TIME_WAIT.
    keepalive 256;
    keepalive_timeout 60s;
}

# O TLS está AQUI, e não deixado para o certbot escrever.
#
# Deixar para o certbot parecia mais simples e criou uma armadilha de deploy:
# reinstalar este arquivo apagava o bloco 443 que ele havia acrescentado, e o
# servidor voltava sem HTTPS — que, neste sistema, é o mesmo que fora do ar.
# Aconteceu. Com os certificados referenciados aqui, reinstalar é idempotente.
#
# `listen 443 ssl;` sem `http2 on;`: essa diretiva só existe a partir do nginx
# 1.25, e o Ubuntu 24.04 traz o 1.24.
#
# INSTALAÇÃO NOVA, onde os certificados ainda não existem: o nginx nem inicia
# apontando para arquivo que não está lá. Emita primeiro, com o nginx servindo
# só a porta 80:
#
#   certbot certonly --webroot -w /opt/nutellaboot3/web \
#       -d nutellaboot.mdp.naquadah.com.br
#
# e só então instale este arquivo.
server {
    listen 80;
    listen [::]:80;
    server_name nutellaboot.mdp.naquadah.com.br;

    # o desafio HTTP-01 da renovação precisa sair pela 80
    location /.well-known/acme-challenge/ {
        root /opt/nutellaboot3/web;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nutellaboot.mdp.naquadah.com.br;

    ssl_certificate /etc/letsencrypt/live/nutellaboot.mdp.naquadah.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutellaboot.mdp.naquadah.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # wallpaper (12 MB), logotipo, e o envio de arquivo para publicação
    client_max_body_size 64m;
    client_body_timeout 120s;

    # 36 requisições por segundo de telemetria não precisam de uma escrita
    # síncrona cada uma
    access_log /var/log/nginx/nutellaboot3.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/nutellaboot3.error.log;

    # --- as telas saem do DISCO, não do Python ---
    # O app monta um StaticFiles em "/", mas servir o console pelo event loop
    # que também atende 1600 long-polls é gastar o recurso mais escasso com a
    # tarefa mais boba.
    root /opt/nutellaboot3/web;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /docs/ {
        alias /opt/nutellaboot3/docs/;
        autoindex on;
    }

    # --- o que é do Python ---
    location /api/ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        # long-poll de comandos: o agente segura até 30 s
        proxy_read_timeout 300s;
    }

    location /boot/ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_read_timeout 300s;
        # o initrd baixa o kernel (17 MB) e o initrd (185 MB) por aqui quando
        # o pendrive está velho; com buffering o nginx guardaria tudo em disco
        # antes de mandar o primeiro byte
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location /blobs/ {
        # camadas squashfs de GB: nunca pelo Python
        alias /var/lib/nutellaboot3/blobs/;
    }

    location /lock/ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_read_timeout 300s;
    }

    location /healthz {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_read_timeout 30s;
        access_log off;
    }

    # --- SSE: o painel do laboratório ---
    # Com buffer, o painel simplesmente nunca atualiza — e o sintoma é "o
    # hotconfig está travado", que manda procurar no lugar errado.
    location ~ ^/api/v1/site-images/[^/]+/events$ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}

# ---------------------------------------------------------------------------
# /etc/nginx/nginx.conf — ajustes globais
# ---------------------------------------------------------------------------
#   worker_processes auto;              # 16 núcleos na máquina
#   worker_rlimit_nofile 65535;
#   events { worker_connections 8192; multi_accept on; }
#
# Conta: cada máquina ocupa DUAS conexões (cliente + upstream). 2000 máquinas
# = 4000, mais os painéis e o resto. 8192 por worker é folga confortável.
