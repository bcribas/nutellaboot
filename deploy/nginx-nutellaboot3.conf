# NutellaBoot 3 — nginx na frente do uvicorn.
#
# Dimensionado para a primeira fase: ~1600 máquinas ligadas ao mesmo tempo,
# teto de 2000. Cada máquina segura UMA conexão esperando comando (long-poll),
# então "conexões simultâneas" aqui não é pico de tráfego — é o estado normal.
#
# Instalar em /etc/nginx/sites-available/nutellaboot3 e ligar por symlink. Os
# ajustes globais (worker_connections, rlimit) vão em nginx.conf; estão
# listados no fim deste arquivo, em comentário, para não se perderem.

upstream nutellaboot3 {
    server 127.0.0.1:8890;
    # Sem isto é um handshake TCP novo por long-poll: ~64 por segundo à toa,
    # e o dobro de sockets em TIME_WAIT.
    keepalive 256;
    keepalive_timeout 60s;
}

# UM bloco só, na porta 80. Quem o promove a 443 é o
# `certbot --nginx -d nutellaboot.mdp.naquadah.com.br`: ele copia este server
# inteiro (com todos os `location`), acrescenta os certificados e deixa o 80
# só com o redirecionamento.
#
# É de propósito não trazer o bloco 443 pronto aqui: sem os certificados no
# disco o nginx nem inicia, e `http2 on;` só existe a partir do nginx 1.25 (o
# Ubuntu 24.04 traz o 1.24, onde a forma é `listen 443 ssl http2;`). Deixar o
# certbot escrever evita as duas armadilhas.
server {
    listen 80;
    listen [::]:80;
    server_name nutellaboot.mdp.naquadah.com.br;

    # wallpaper (12 MB), logotipo, e o envio de arquivo para publicação
    client_max_body_size 64m;
    client_body_timeout 120s;

    # 36 requisições por segundo de telemetria não precisam de uma escrita
    # síncrona cada uma
    access_log /var/log/nginx/nutellaboot3.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/nutellaboot3.error.log;

    # --- as telas saem do DISCO, não do Python ---
    # O app monta um StaticFiles em "/", mas servir o console pelo event loop
    # que também atende 1600 long-polls é gastar o recurso mais escasso com a
    # tarefa mais boba.
    root /opt/nutellaboot3/web;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /docs/ {
        alias /opt/nutellaboot3/docs/;
        autoindex on;
    }

    # --- o que é do Python ---
    location /api/ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        # long-poll de comandos: o agente segura até 30 s
        proxy_read_timeout 300s;
    }

    location /boot/ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_read_timeout 300s;
        # o initrd baixa o kernel (17 MB) e o initrd (185 MB) por aqui quando
        # o pendrive está velho; com buffering o nginx guardaria tudo em disco
        # antes de mandar o primeiro byte
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location /blobs/ {
        # camadas squashfs de GB: nunca pelo Python
        alias /var/lib/nutellaboot3/blobs/;
    }

    location /lock/ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_read_timeout 300s;
    }

    location /healthz {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_read_timeout 30s;
        access_log off;
    }

    # --- SSE: o painel do laboratório ---
    # Com buffer, o painel simplesmente nunca atualiza — e o sintoma é "o
    # hotconfig está travado", que manda procurar no lugar errado.
    location ~ ^/api/v1/site-images/[^/]+/events$ {
        include /etc/nginx/snippets/nutellaboot3-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}

# ---------------------------------------------------------------------------
# /etc/nginx/snippets/nutellaboot3-proxy.conf
# ---------------------------------------------------------------------------
#   proxy_pass http://nutellaboot3;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";          # exige keepalive no upstream
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_send_timeout 300s;
#   proxy_connect_timeout 10s;
#
# `proxy_read_timeout` NÃO entra no snippet: o nginx recusa diretiva repetida
# no mesmo contexto, e o SSE precisa de um valor diferente do resto. Fica em
# cada `location`.
#
# ---------------------------------------------------------------------------
# /etc/nginx/nginx.conf — ajustes globais
# ---------------------------------------------------------------------------
#   worker_processes auto;              # 16 núcleos na máquina
#   worker_rlimit_nofile 65535;
#   events { worker_connections 8192; multi_accept on; }
#
# Conta: cada máquina ocupa DUAS conexões (cliente + upstream). 2000 máquinas
# = 4000, mais os painéis e o resto. 8192 por worker é folga confortável.
