# Trecho comum a todo `location` que vai para o uvicorn.
#
# Instalar em /etc/nginx/snippets/nutellaboot3-proxy.conf. É arquivo, e não
# instrução em comentário, porque produção não recebe edição manual: o que não
# está versionado some no próximo reinstall e não aparece em nenhum diff.
#
# `proxy_read_timeout` NÃO entra aqui: o nginx recusa diretiva repetida no
# mesmo contexto, e o SSE precisa de um valor diferente do resto. Fica em cada
# `location`.

proxy_pass http://nutellaboot3;

# 1.1 + Connection vazio é o que permite o keepalive com o upstream; sem isso é
# um handshake TCP novo por long-poll, ~64 por segundo à toa.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_send_timeout 300s;
proxy_connect_timeout 10s;
