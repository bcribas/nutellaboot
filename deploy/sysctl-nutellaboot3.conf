# NutellaBoot 3 — ajustes de rede para a primeira fase.
#
# Instalar em /etc/sysctl.d/60-nutellaboot3.conf e aplicar com
# `sysctl --system`.
#
# O caso que dimensiona tudo aqui não é tráfego: é 1600 máquinas ligando quase
# ao mesmo tempo (uma sala inteira no mesmo minuto) e depois ficando com uma
# conexão presa cada, esperando comando. São conexões ociosas, mas são
# conexões.

# Fila de conexões aceitas mas ainda não atendidas. O padrão (4096 no Ubuntu
# 24.04, 128 em kernels mais antigos) é o teto real do `--backlog` do uvicorn:
# pedir 4096 lá sem levantar aqui não adianta nada.
net.core.somaxconn = 4096

# Fila de SYN pendentes: a rajada de ligar a sala inteira cabe aqui.
net.ipv4.tcp_max_syn_backlog = 8192

# Conexões órfãs e em TIME_WAIT: com milhares de long-polls terminando e
# recomeçando, o padrão fica apertado.
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.tcp_fin_timeout = 15

# Reaproveitar sockets em TIME_WAIT para conexões de saída (o rsync para o
# files.mdp, os webhooks). Só afeta quem CONECTA, não quem recebe.
net.ipv4.tcp_tw_reuse = 1

# Faixa de portas efêmeras: o nginx abre uma para cada conexão ao uvicorn.
net.ipv4.ip_local_port_range = 10240 65535

# Descritores do sistema inteiro. O serviço tem LimitNOFILE=65535 e o nginx
# worker_rlimit_nofile=65535; o teto global precisa comportar os dois.
fs.file-max = 262144
