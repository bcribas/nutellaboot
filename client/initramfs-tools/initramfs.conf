# Configuração do initramfs do NutellaBoot 3.
# MODULES=most: a imagem roda em hardware desconhecido (laboratórios de
# universidades diversas), então levamos drivers de sobra.
MODULES=most
BUSYBOX=auto
COMPRESS=zstd
# DEVICE vazio: a escolha da interface é feita pelo script (cabeada primeiro,
# depois wifi), não pelo ipconfig.
DEVICE=
NFSROOT=auto
RUNSIZE=10%
FSTYPE=auto
